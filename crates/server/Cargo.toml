[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cloudberry"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "process", "signal", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2" # already in the tree via tokio; for killpg
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["test-util"] } # time::pause for linger timers
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
